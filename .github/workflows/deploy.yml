name: Build and Deploy to Wildfly

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Upload WAR file as artifact
        uses: actions/upload-artifact@v3
        with:
          name: springboot-war
          path: target/*.war

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download WAR file
        uses: actions/download-artifact@v3
        with:
          name: springboot-war
          path: ./target

      - name: Deploy WAR to Wildfly
        env:
          WILDFLY_HOST: ${{ secrets.localhost }}
          WILDFLY_PORT: ${{ secrets.9990 }}
          WILDFLY_USER: ${{ secrets.todd }}
          WILDFLY_PASSWORD: ${{ secrets.wenying0823 }}
        run: |
          curl --insecure --user $WILDFLY_USER:$WILDFLY_PASSWORD \
          --upload-file ./target/*.war \
          http://$WILDFLY_HOST:$WILDFLY_PORT/management/webauthn/deploy
